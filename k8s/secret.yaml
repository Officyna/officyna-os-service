apiVersion: v1
kind: Secret
metadata:
  name: officyna-secret
  labels:
    app.kubernetes.io/name: officyna-os
  namespace: officyna
type: Opaque
stringData:
  MONGODB_URI: "${MONGODB_URI}"
  JWT_SECRET: "${JWT_SECRET}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
