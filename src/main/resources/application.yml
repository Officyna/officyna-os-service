spring:
  jackson:
    read-unknown-enum-values-as-null: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/officyna}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:officyna-secret-key-change-in-production-min-256bits}
  #3600000=1hr, 28800000=8hrs, 86400000=24hrs

  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

database:
  seed:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    br.com.officyna: INFO
    org.springframework.security: INFO

services:
  production:
    url: ${PRODUCTION_SERVICE_URL:http://localhost:8082}

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  access-key: ${AWS_ACCESS_KEY_ID:test}
  secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  sqs:
    listener:
      enabled: ${AWS_SQS_LISTENER_ENABLED:true}
      wait-time-seconds: ${AWS_SQS_WAIT_TIME_SECONDS:5}
      poll-delay-ms: ${AWS_SQS_POLL_DELAY_MS:2000}
    inbound-queue: ${AWS_SQS_INBOUND_QUEUE:os-service-queue}
    production-queue: ${AWS_SQS_PRODUCTION_QUEUE:production-service-queue}
